<!doctype html>
<!--
  src/parts/portrait-clipping.html — 찢긴 사진 틀 + 이름 + 점선 (레퍼런스 ① 인물 초상)
  크기: 1600×760. 사진 틀 왼쪽(560×700), 이름 · 점선 오른쪽. paper-ground 위에 얹는다
  바꾸는 부분: #portrait-clipping-photo 의 href (흑백 사진 · src/assets/photos/) · #portrait-clipping-name(이름 · 대상, 한 줄)
              #portrait-clipping-sub(연도 · 한 줄 설명, 비워도 됨)
  건드리지 않는 것: 거친 테두리 모양(seed 고정) · 잉크 번짐 · 점선 · 십자표 위치
  사진 규칙: 흑백(회색조) 사진만. 색 사진은 넣기 전에 흑백으로 바꾼다 (design.md 6장)
  따로 움직일 수 있는 조각: #portrait-clipping-frame(사진 틀) · #portrait-clipping-photo-wrap(틀 안 사진) · #portrait-clipping-name · #portrait-clipping-sub · #portrait-clipping-dots(점선) · #portrait-clipping-cross(십자)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>portrait-clipping</title>
<link rel="stylesheet" href="tokens.css">
<style>
  #portrait-clipping { position: relative; width: 1600px; height: 760px; }
  #portrait-clipping-frame { position: absolute; left: 0; top: 30px; width: 560px; height: 700px; transform: rotate(-1.2deg); }
  #portrait-clipping-frame svg { width: 100%; height: 100%; overflow: visible; }
  #portrait-clipping-text { position: absolute; left: 660px; top: 250px; width: 900px; }
  #portrait-clipping-name { font-size: var(--text-name); line-height: 1.2; font-weight: 500; color: var(--color-ink-soft); letter-spacing: 0.01em; }
  #portrait-clipping-sub { margin-top: var(--space-16); font-size: var(--text-label); line-height: 1.4; color: var(--color-ink-soft); }
  #portrait-clipping-sub:empty { display: none; }
  #portrait-clipping-dots { margin-top: var(--space-48); width: 620px; height: 6px;
    background: radial-gradient(circle, var(--color-ink) 2.4px, transparent 2.8px) 0 50% / var(--dot-gap) 6px repeat-x; }
  #portrait-clipping-cross { position: absolute; left: 600px; top: 600px; width: 34px; height: 34px; }
  #portrait-clipping-cross::before, #portrait-clipping-cross::after { content: ""; position: absolute; background: var(--color-ink-faint); }
  #portrait-clipping-cross::before { left: 16px; top: 0; width: 2px; height: 34px; }
  #portrait-clipping-cross::after { top: 16px; left: 0; height: 2px; width: 34px; }
</style>
</head>
<body>
  <div id="portrait-clipping">
    <div id="portrait-clipping-frame">
      <svg viewBox="0 0 560 700" aria-hidden="true">
        <defs>
          <!-- 거친 가장자리: 같은 seed면 언제나 같은 모양 -->
          <filter id="pc-rough-outer" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="7" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="pc-rough-inner" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="21" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation="1.2"/>
          </filter>
          <mask id="pc-photo-mask"><rect x="34" y="34" width="492" height="632" fill="#fff" filter="url(#pc-rough-inner)"/></mask>
          <radialGradient id="pc-burn" cx="50%" cy="45%" r="70%">
            <stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
          </radialGradient>
        </defs>
        <!-- 잉크 번진 바깥 틀 -->
        <rect x="12" y="12" width="536" height="676" fill="#1d1d1b" filter="url(#pc-rough-outer)"/>
        <!-- 사진 (안쪽 거친 가장자리로 잘림) -->
        <g mask="url(#pc-photo-mask)">
          <g id="portrait-clipping-photo-wrap">
            <image id="portrait-clipping-photo" href="../assets/photos/sample-element-ge.png" x="0" y="0" width="560" height="700" preserveAspectRatio="xMidYMid slice"/>
          </g>
          <rect x="0" y="0" width="560" height="700" fill="url(#pc-burn)"/>
        </g>
      </svg>
    </div>
    <div id="portrait-clipping-text">
      <p id="portrait-clipping-name">저마늄 · Germanium</p>
      <p id="portrait-clipping-sub">1886년 발견</p>
      <div id="portrait-clipping-dots"></div>
    </div>
    <div id="portrait-clipping-cross"></div>
  </div>
</body>
</html>
