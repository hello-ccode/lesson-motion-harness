<!doctype html>
<!--
  src/parts/headline-page.html — 신문 헤드라인 클로즈업 (레퍼런스 ② 헤드라인)
  크기: 1920×1080 한 화면. paper-ground 위에 얹는다
  구성: 화면 위로 잘려 나가는 거대한 명조 헤드라인 → 빨간 굵은 줄 → 오른쪽 정렬 문장(형광펜) → 짧은 검정 줄 → 왼쪽 아래 라벨
  바꾸는 부분: #headline-page-word(헤드라인 낱말 1개, 2~5글자) · #headline-page-lead 의 두 줄(.line)
              형광펜 칠할 부분은 <span class="hl"><span class="hl-ink"></span>글자</span> 로 감싼다 (한 장면에 한 군데)
              #headline-page-tag(라벨 글자: 과목 · 단원)
  건드리지 않는 것: 헤드라인이 위로 잘리는 위치(top -90) · 빨간 줄 굵기 · 오른쪽 정렬 · 라벨 자리
  따로 움직일 수 있는 조각: #headline-page-word(헤드라인) · #headline-page-rule(빨간 줄, 왼쪽 기준) · #headline-page-lead 의 .line(줄마다) · .hl-ink(형광펜, 왼쪽 기준) · #headline-page-short(짧은 줄, 오른쪽 기준) · #headline-page-tag
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>headline-page</title>
<link rel="stylesheet" href="tokens.css">
<style>
  #headline-page { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #headline-page-word { position: absolute; left: -40px; top: -90px; white-space: nowrap;
    font-size: var(--text-masthead); line-height: 1; font-weight: 900; letter-spacing: -0.03em; color: var(--color-ink); }
  #headline-page-rule { position: absolute; left: 0; right: 0; top: 330px; height: var(--rule-thick); background: var(--color-rule); transform-origin: 0 50%; }
  #headline-page-lead { position: absolute; right: 120px; top: 400px; width: 1500px; text-align: right;
    font-size: var(--text-lead); line-height: 1.55; font-weight: 400; font-style: italic; color: var(--color-ink); }
  .hl { position: relative; display: inline-block; }
  .hl-ink { position: absolute; left: -10px; right: -10px; top: 18%; bottom: 8%; background: var(--color-highlight);
    mix-blend-mode: multiply; transform-origin: 0 50%; border-radius: 4px 10px 6px 12px; z-index: -1; }
  .hl { z-index: 0; isolation: isolate; }
  #headline-page-short { position: absolute; right: 120px; top: 700px; width: 240px; height: var(--rule-thin); background: var(--color-ink); transform-origin: 100% 50%; }
  #headline-page-tag { position: absolute; left: 60px; bottom: 60px; padding: 10px 22px; background: var(--color-tag); color: var(--color-on-tag);
    font-family: var(--font-sans); font-size: var(--text-label); line-height: 1.2; font-weight: 700; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div id="headline-page">
    <div id="headline-page-word">주기율표</div>
    <div id="headline-page-rule"></div>
    <p id="headline-page-lead">
      <span class="mask"><span class="line">원소를 원자량 순서로 늘어놓고,</span></span>
      <span class="mask"><span class="line">아직 모르는 원소의 자리는 <span class="hl"><span class="hl-ink"></span>빈칸으로 남겨 두었다.</span></span></span>
    </p>
    <div id="headline-page-short"></div>
    <div id="headline-page-tag">통합과학 · 물질의 규칙성</div>
  </div>
</body>
</html>
