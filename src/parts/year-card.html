<!doctype html>
<!--
  src/parts/year-card.html — 연도 카드 (레퍼런스 ③ 연도)
  크기: 1920×1080 전면. 사진이 화면을 꽉 채우고 그 위에 큰 연도 + 명조 부제
  바꾸는 부분: #year-card-photo 의 src (흑백 사진, 전면) · #year-card-year(연도 4자리) · #year-card-title(부제 한 줄)
              #year-card-note(오른쪽 위 흐린 타자 글씨 2~3줄, 비워도 됨 — 질감용 장식 글씨라 최소 글자 크기 예외)
  건드리지 않는 것: 글자 자리(왼쪽 가운데) · 사진 어둡게 깔기(#year-card-shade) · 글자 그림자
  사진 규칙: 흑백 · 전면 · 1920×1080 이상. 글자 뒤가 너무 밝으면 #year-card-shade 의 세기만 0.35~0.55 사이에서 고른다
  따로 움직일 수 있는 조각: #year-card-photo-wrap(사진) · .digit(연도 한 자리씩) · #year-card-title 의 .line · #year-card-note
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>year-card</title>
<link rel="stylesheet" href="tokens.css">
<style>
  #year-card { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #222; }
  #year-card-photo-wrap { position: absolute; inset: 0; }
  #year-card-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
  #year-card-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,10,0.45) 0%, rgba(10,10,10,0.15) 60%, rgba(10,10,10,0.05) 100%); }
  #year-card-text { position: absolute; left: 180px; top: 300px; color: var(--color-on-photo); text-shadow: 0 4px 24px rgba(0,0,0,0.45); }
  #year-card-year { font-family: var(--font-sans); font-size: var(--text-year); line-height: 1; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .digit { display: inline-block; }
  #year-card-title { margin-top: var(--space-16); font-size: var(--text-title); line-height: 1.2; font-weight: 500; }
  #year-card-note { position: absolute; right: 90px; top: 70px; width: 520px; text-align: left; color: var(--color-on-photo); opacity: 0.55;
    font-size: 26px; line-height: 1.5; font-weight: 400; filter: blur(0.6px); }
</style>
</head>
<body>
  <div id="year-card">
    <div id="year-card-photo-wrap"><img id="year-card-photo" src="../assets/photos/sample-table-1869.png" alt=""></div>
    <div id="year-card-shade"></div>
    <div id="year-card-note">원소 예순세 가지를 한 장의 표에 담았다.<br>비어 있는 칸에는 물음표를 적었다.</div>
    <div id="year-card-text">
      <div id="year-card-year"><span class="digit">1</span><span class="digit">8</span><span class="digit">6</span><span class="digit">9</span></div>
      <p id="year-card-title"><span class="mask"><span class="line">주기율표의 탄생</span></span></p>
    </div>
  </div>
</body>
</html>
