<!doctype html>
<!--
  src/parts/rules-note.html — "기억해요" 세 줄 (1주차 nt-rules의 새 룩 판. docs/video.md 6-2)
  크기: 1920×1080, 투명 (bg-paper 위에 얹는다)
  모양: 위 · 아래 변이 잘게 찢긴 밝은 종이 쪽지 한 장(definition-note와 같은 종이). 맨 위 제목 "기억해요"(명조 아주 굵게),
        아래 세로 목록 3줄: 줄마다 주황 점 + 한 줄. 왼쪽 정렬. 카드 3장을 가로로 늘어놓지 않는다(발표 슬라이드처럼 보임).
  바꾸는 부분: #rn-line-1 · #rn-line-2 · #rn-line-3 의 글 (수업 자료 문장 그대로. 새 문장 금지) · 핵심 낱말은 <b>
              #rn-source(출처: 수업 자료 슬라이드 번호, 한 줄)
              줄은 정확히 3줄. 한 줄은 쪽지 안쪽 폭 안에서 줄바꿈 없이 (공백 뺀 15자 이하가 안전, 실측은 약 20자까지)
  건드리지 않는 것: 쪽지 자리(left 200px, top 200px, 너비 1300px. 왼쪽 위 · 오른쪽 아래 모서리가 바탕의 찢긴 선 안쪽에 오도록 정함) · 제목 글꼴(노토 세리프 KR 900, 120px) · 줄 글자 크기(72px, text-title)
                  · 주황 점 크기(38px) · 줄 간격 28px · 동그라미 · 형광펜을 쓰지 않는다
  따로 움직일 수 있는 조각: #rn-note-wrap(쪽지) · #rn-head 의 .line · #rn-line-1 · #rn-line-2 · #rn-line-3(줄마다 따로. 내레이션이 그 줄을 읽기 시작할 때 하나씩, 줄마다 3초 안팎 머묾)
                         · #rn-source
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>rules-note</title>
<link rel="stylesheet" href="tokens.css">
<style>
  #rules-note { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #rn-note-wrap { position: absolute; left: 200px; top: 200px; width: 1300px; filter: drop-shadow(0 8px 10px rgba(40, 24, 8, 0.30)); }
  #rn-note { position: relative; background: var(--color-paper-light); padding: 72px 90px 64px; box-sizing: border-box; }
  #rn-head { font: 900 var(--text-headline)/1.1 var(--font-serif); color: var(--color-ink); letter-spacing: -0.02em; }
  #rn-list { margin-top: var(--space-48); display: flex; flex-direction: column; gap: 28px; }
  .rn-line { display: flex; align-items: center; gap: 24px; font: 600 var(--text-title)/1.3 var(--font-sans); color: var(--color-ink); white-space: nowrap; }
  .rn-line b { font-weight: 700; }
  .rn-dot { flex: none; width: var(--dot-size); height: var(--dot-size); border-radius: 50%; background: var(--color-accent); box-shadow: 0 0 0 5px var(--color-paper-light); }
  #rn-source { margin-top: var(--space-32); font: 600 var(--text-source)/1 var(--font-sans); color: var(--color-ink-soft); }
</style>
</head>
<body>
  <div id="rules-note">
    <div id="rn-note-wrap">
      <div id="rn-note" data-torn="top bottom" data-torn-amp="7" data-torn-step="10" data-seed="61">
        <h2 id="rn-head"><span class="mask"><span class="line">기억해요</span></span></h2>
        <div id="rn-list">
          <p class="rn-line" id="rn-line-1"><span class="rn-dot"></span><span>받은 이자까지 합쳐서 <b>다시 이자</b></span></p>
          <p class="rn-line" id="rn-line-2"><span class="rn-dot"></span><span><b>일찍</b> 시작할수록 커져요</span></p>
          <p class="rn-line" id="rn-line-3"><span class="rn-dot"></span><span><b>빌린 돈</b>은 빨리 갚아요</span></p>
        </div>
        <p id="rn-source">수업 자료 슬라이드14 · 16 · 17</p>
      </div>
    </div>
  </div>
<script src="paper-kit.js"></script>
</body>
</html>
