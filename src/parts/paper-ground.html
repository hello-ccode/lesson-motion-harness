<!doctype html>
<!--
  src/parts/paper-ground.html — 신문지 바탕 (모든 장면의 맨 아래 층)
  크기: 2400×1350 (영상보다 25% 크게 — 카메라가 움직여도 가장자리가 안 보임). 화면 가운데에 두고 x·y·scale로 카메라를 움직인다
  층 (아래 → 위):
    #paper-ground-paper      종이 (assets/textures/paper.jpg)
    #paper-ground-newsprint  뒤 신문 글자 (assets/textures/newsprint.png) — 흐림 · 반투명, 장면마다 x 위치만 바꿔 다른 면처럼 보이게
    #paper-ground-vignette   가장자리 어둡게
  필름 그레인(assets/textures/grain.png)은 영상 전체에 한 장만 얹는다 (장면마다 넣지 않음)
  바꾸는 부분: #paper-ground-newsprint 의 background-position (장면마다 다른 기사 면)
  건드리지 않는 것: 질감 파일 · 흐림 · 투명도 (design.md 5장)
  따로 움직일 수 있는 조각: #paper-ground(전체 — 카메라) · #paper-ground-newsprint(뒤 신문 글자 층)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>paper-ground</title>
<link rel="stylesheet" href="tokens.css">
<style>
  #paper-ground { position: relative; width: 2400px; height: 1350px; overflow: hidden; }
  #paper-ground > div { position: absolute; inset: 0; }
  #paper-ground-paper { background: url("../assets/textures/paper.jpg") center / cover; }
  #paper-ground-newsprint {
    background: url("../assets/textures/newsprint.png") 0 0 / 2400px 1350px no-repeat;
    opacity: var(--newsprint-opacity);
    filter: blur(var(--newsprint-blur));
    mix-blend-mode: multiply;
  }
  #paper-ground-vignette { background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(20,18,15,0.35) 100%); }
</style>
</head>
<body>
  <div id="paper-ground">
    <div id="paper-ground-paper"></div>
    <div id="paper-ground-newsprint"></div>
    <div id="paper-ground-vignette"></div>
  </div>
</body>
</html>
