<!doctype html>
<!--
  src/parts/material-card.html — 자료 + 이름 (역할 칸: 자료 + 이름)
  크기: 1920×1080, 투명 (bg-paper 위에 얹는다)
  모양: 오른쪽에 찢은 종이 쪽지 한 장(위 · 아래 변이 찢김, 살짝 기울임)이 붙어 있고 그 안에 자료(표 · 막대그래프 · 그림) 하나.
        왼쪽 위에 자료 이름, 이름에서 쪽지로 휘어진 화살표 한 줄. (이름 + 화살표 = vox_연도표기_13초의 이름표 구도,
        쪽지 = 카톡영상_종이질감_946.6초의 찢은 라벨)
  바꾸는 부분: #mc-name(자료 이름, 한 줄) · #mc-caption(자료 위 설명 한 줄, 수업 자료 문장 그대로) · #mc-slot 안의 자료
              - 표: 지금처럼 <table>. 숫자는 수업 자료 그대로. 강조할 칸은 <b>
              - 그림(시계 · 동전 등): <table>을 지우고 <img class="mc-art"> 하나 (나중에 따로 만든 그림)
              - 막대그래프: 아직 부품 없음 (design.md 7장 '아직 없는 것')
              #mc-source(출처: 수업 자료 슬라이드 번호)
  건드리지 않는 것: 쪽지 자리(left 560px, top 180px, 너비 1180px, 높이는 자료에 맞춰 저절로) · 기울기(-1도) · 화살표 굵기(5px)
                  · 글자 크기(설명 줄 56px, 표 안의 값 72px, 표 머리줄 44px) · 이름 칸 너비 360px(두 줄로 접힘)
                  (11/9 선생님 피드백 "표가 더 컸으면": 쪽지 700→560px, 1060→1180px, 값 56→72px, 설명 44→56px, 머리줄 40→44px)
  따로 움직일 수 있는 조각: #mc-name · #mc-arrow(그려지듯) · #mc-card-wrap(쪽지: 붙여지듯) · #mc-slot 의 tr(줄마다 하나씩) · #mc-source
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>material-card</title>
<link rel="stylesheet" href="tokens.css">
<style>
  #material-card { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #mc-name { position: absolute; left: var(--safe-x); top: 380px; width: 360px; font: 700 var(--text-title)/1.15 var(--font-sans); color: var(--color-ink); word-break: keep-all; }
  #mc-arrow { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  #mc-arrow path { fill: none; stroke: var(--color-ink); stroke-width: var(--line-thick); stroke-linecap: round; stroke-linejoin: round; }
  #mc-card-wrap { position: absolute; left: 560px; top: 180px; width: 1180px; transform: rotate(-1deg);
    filter: drop-shadow(0 8px 10px rgba(40, 24, 8, 0.30)); }
  #mc-card { position: relative; background: var(--color-paper-light); padding: 64px 80px 44px; box-sizing: border-box; }
  #mc-caption { font: 700 var(--text-lead)/1.3 var(--font-sans); color: var(--color-ink); margin-bottom: var(--space-24); }
  #mc-slot table { width: 100%; border-collapse: collapse; font-family: var(--font-sans); color: var(--color-ink); }
  #mc-slot th { font: 700 44px/1 var(--font-sans); color: var(--color-ink-soft); text-align: left; padding: 0 0 18px; border-bottom: 4px solid var(--color-ink); }
  #mc-slot td { font: 400 var(--text-title)/1 var(--font-sans); padding: 16px 0; border-bottom: 2px solid rgba(15, 38, 57, 0.35); font-variant-numeric: tabular-nums; }
  #mc-slot td b { font-weight: 700; }
  #mc-slot .mc-art { display: block; width: 100%; height: 520px; object-fit: contain; }
  #mc-source { margin-top: var(--space-32); font: 600 var(--text-source)/1 var(--font-sans); color: var(--color-ink-soft); }
</style>
</head>
<body>
  <div id="material-card">
    <p id="mc-name"><span class="mask"><span class="line">단리 · 복리</span></span></p>
    <svg id="mc-arrow" viewBox="0 0 1920 1080">
      <path d="M300 580 C 320 690, 400 730, 510 700"/>
      <path d="M480 672 L512 700 L476 724"/>
    </svg>
    <div id="mc-card-wrap">
      <div id="mc-card" data-torn="top bottom" data-torn-amp="10" data-torn-step="14" data-seed="31">
        <p id="mc-caption">100만 원을 맡기고 1년에 10%씩 이자</p>
        <div id="mc-slot">
          <table>
            <tr><th>기간</th><th>단리</th><th>복리</th></tr>
            <tr><td>1년 뒤</td><td>110만 원</td><td>110만 원</td></tr>
            <tr><td>2년 뒤</td><td>120만 원</td><td><b>121만 원</b></td></tr>
            <tr><td>3년 뒤</td><td>130만 원</td><td><b>133만 1천 원</b></td></tr>
          </table>
        </div>
        <p id="mc-source">수업 자료 슬라이드14</p>
      </div>
    </div>
  </div>
<script src="paper-kit.js"></script>
</body>
</html>
